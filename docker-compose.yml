services:
  api:
    build:
      context: .
      target: web
    environment:
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_DB_PATH: /app/storage/cache.db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RELIABLE_NEWS_DOMAINS: ${RELIABLE_NEWS_DOMAINS:-}
      GUIDANCE_PDF_PATHS: ${GUIDANCE_PDF_PATHS:-}
    expose:
      - "8000"
    volumes:
      - api-data:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  api-data:
