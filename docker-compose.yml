services:
  api:
    build:
      context: .
      target: web
    environment:
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_DB_PATH: /app/storage/cache.db
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: 5
      REDIS_SOCKET_TIMEOUT_SECONDS: 15
      OCR_QUEUE_NAME: ocr_jobs
      OCR_JOB_TTL_SECONDS: 1800
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RELIABLE_NEWS_DOMAINS: ${RELIABLE_NEWS_DOMAINS:-}
      GUIDANCE_PDF_PATHS: ${GUIDANCE_PDF_PATHS:-}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - api-data:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    command: sleep infinity
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: 5
      REDIS_SOCKET_TIMEOUT_SECONDS: 15
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OCR_QUEUE_NAME: ocr_jobs
      OCR_JOB_TTL_SECONDS: 1800
      EASYOCR_LANGS: ${EASYOCR_LANGS:-en,uk}
      OCR_MAX_IMAGE_DIMENSION: 1200
      OCR_DOWNLOAD_MODELS: "true"
      EASYOCR_MODEL_DIR: /app/storage/easyocr
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - worker-models:/app/storage/easyocr
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

volumes:
  api-data:
  worker-models:
  redis-data:
