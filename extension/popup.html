<!DOCTYPE html>
<html>

<head>
  <title>SRT Fact-Check AI</title>
  <style>
    body {
      width: 380px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f4f7f6;
      color: #24313a;
    }

    body.embedded {
      width: auto;
      min-width: 0;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
      color: #2c3e50;
    }

    .content-box {
      width: 100%;
      box-sizing: border-box;
      background: white;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
      margin-bottom: 15px;
      min-height: 80px;
      max-height: 200px;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      font-family: inherit;
    }

    #result {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    .section {
      display: none;
      margin-top: 12px;
      background: #fff;
      border: 1px solid #dde7e3;
      border-radius: 8px;
      padding: 10px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #2c3e50;
    }

    .hint-text {
      color: #66757f;
      font-size: 11px;
      line-height: 1.35;
    }

    button {
      width: 100%;
      background: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    button:disabled {
      background: #bdc3c7;
    }

    .copy-btn {
      margin-top: 10px;
      background: #27ae60;
      display: none;
    }

    .copy-btn:hover {
      background: #219150;
    }

    .retry-btn {
      margin-top: 5px;
      background: #7f8c8d;
      padding: 5px;
      font-size: 11px;
    }

    .retry-btn:hover {
      background: #95a5a6;
    }

    canvas {
      display: none;
    }

    .loading {
      text-align: center;
      display: none;
      margin-top: 10px;
    }

    .loading-dots:after {
      content: '.';
      animation: dots 1s steps(5, end) infinite;
    }

    .report-link {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .report-link:hover {
      text-decoration: underline;
    }

    .save-source-btn {
      margin-top: 6px;
      width: auto;
      background: #16a085;
      padding: 6px 10px;
      font-size: 11px;
    }

    .save-source-btn:hover {
      background: #138d75;
    }

    .secondary-btn {
      width: auto;
      padding: 5px 8px;
      font-size: 11px;
      background: #607d8b;
      margin: 4px 4px 0 0;
    }

    .secondary-btn:hover {
      background: #546e7a;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .decision-btn {
      padding: 7px 5px;
      font-size: 11px;
      line-height: 1.15;
      background: #34495e;
    }

    .decision-btn:hover,
    .decision-btn.active {
      background: #1f618d;
    }

    .claim-option,
    .evidence-item {
      margin-bottom: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .claim-option.active,
    .evidence-item.best {
      border-color: #999;
      background: #fafafa;
    }

    .evidence-item.rejected {
      opacity: 0.55;
      border-style: dashed;
    }

    .source-domain {
      display: inline-block;
      margin-bottom: 4px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef2f3;
      color: #52636d;
      font-size: 10px;
      font-weight: 700;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-status {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      color: #2c3e50;
      background: #ecf9f6;
      border: 1px solid #cdeee6;
      border-radius: 6px;
      padding: 8px;
    }

    @keyframes dots {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60% {
        content: '...';
      }

      80%,
      100% {
        content: '';
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h2 id="title">SRT Fact-Check AI</h2>
  </div>

  <textarea id="detected-text" class="content-box" style="min-height: 120px; height: 120px;">
    Detecting content...
  </textarea>
  <div style="display: flex; justify-content: flex-end; margin-top: -10px; margin-bottom: 10px;">
    <button id="retry-btn" class="retry-btn" style="width: auto;">Retry Detection</button>
  </div>

  <div style="margin-bottom:10px;">
    <button id="pin-btn" class="retry-btn">Pin To Page</button>
  </div>

  <div style="margin-bottom:10px;">
    <button id="check-btn" disabled>Fact Check Claim</button>
  </div>

  <div id="loading" class="loading">
    Analyzing claim<span class="loading-dots"></span>
  </div>

  <div id="extracted-claim-box" class="section">
    <div class="section-title">
      <span>Claim</span>
    </div>
    <div id="extracted-claim-text"></div>
  </div>

  <div id="result"></div>
  <button id="copy-btn" class="copy-btn">Copy Report</button>

  <div id="decision-section" class="section">
    <div class="section-title">
      <span>Final Decision</span>
      <span class="hint-text">Saves with best source</span>
    </div>
    <div id="decision-buttons" class="decision-grid"></div>
  </div>

  <div id="evidence-section" class="section">
    <div class="section-title">
      <span>Evidence Links</span>
      <button id="copy-links-btn" class="retry-btn" style="width:auto; font-size:11px; padding:4px 10px;">Copy All
        Links</button>
    </div>
    <div style="margin-bottom:8px;">
      <button id="open-all-links-btn" class="secondary-btn">Open All</button>
      <button id="copy-source-verdict-btn" class="secondary-btn">Copy Source + Verdict</button>
    </div>
    <div id="evidence-links"></div>
    <div id="save-review-status" class="mini-status"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
